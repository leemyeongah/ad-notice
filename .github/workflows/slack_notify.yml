name: 매체 신규 소식 Slack 알림

on:
  # 자동 스케줄은 없음 - 예약 실행이 몇 시간씩 밀려 엉뚱한 시간에 발송되는 문제가 있어서,
  # 매번 Actions 탭에서 Run workflow로 직접 눌러 발송한다.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests

      - name: Slack 알림 발송
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python notify_slack.py

      - name: 발송 완료 처리 커밋
        run: |
          git config user.name "notice-bot"
          git config user.email "notice-bot@users.noreply.github.com"
          git add data/pending_slack_notification.json
          git diff --cached --quiet || git commit -m "chore: Slack 알림 발송 완료 처리"
          git push
