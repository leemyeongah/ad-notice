<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매체 공지 모니터</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link href="./dashboard_files/css2" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel-hover: #fbfbfc;
    --page: #ffffff;
    --border: #e6e8ec;
    --border-soft: #eef0f3;
    --text: #1a1d24;
    --muted: #6b7280;
    --faint: #9aa1ac;
    --accent: #2f6fed;

    --nosp: #12967a;
    --common: #7c5cff;
    --kakao: #a3760a;
    --meta: #3b6fe0;
    --nasmedia: #e0562f;
    --toss: #0064ff;
    --tiktok: #d0195a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px 16px;
    padding: 16px 28px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  .brand .dot { color: var(--accent); }
  .live-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .live-chip .pulse-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(47,111,237,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(47,111,237,0); }
    100% { box-shadow: 0 0 0 0 rgba(47,111,237,0); }
  }
  .live-chip b { color: var(--accent); font-weight: 700; }

  .tab-nav { display: flex; gap: 4px; }
  .tab-btn {
    font-size: 13px;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 20px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
  }

  .wrap { max-width: 920px; margin: 0 auto; padding: 32px 24px 80px; }

  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 24px;
  }
  .page-head h1 {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }
  .page-sub {
    font-size: 12.5px;
    color: var(--muted);
  }

  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .filter-btn {
    font-size: 12.5px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .filter-btn:hover { border-color: #c7ccd6; color: var(--text); }
  .filter-btn.active {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 16px;
  }

  /* ---- search ---- */
  .search-bar { position: relative; margin-bottom: 16px; }
  .search-input {
    width: 100%;
    font-size: 13.5px;
    font-family: inherit;
    padding: 11px 36px 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
  }
  .search-input:focus { outline: none; border-color: var(--accent); }
  .search-clear {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    color: var(--faint);
    font-size: 15px;
    cursor: pointer;
    display: none;
  }

  /* ---- week picker (나스미디어 뉴스클리핑 발행 주 기준 기간 조회) ---- */
  .week-picker {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .week-nav-btn {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
  }
  .week-nav-btn:hover:not(:disabled) { border-color: #c7ccd6; color: var(--text); }
  .week-nav-btn:disabled { opacity: 0.35; cursor: default; }
  .week-select {
    flex: 1;
    font-size: 13px;
    font-family: inherit;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);

    color: var(--text);

  /* ---- clipping hero ---- */
  .clip-hero-eyebrow {
    display: flex;

    gap: 6px;
    font-size: 11px;
    color: var(--nasmedia);

  }
  .clip-hero-title { font-size: 16.5px; font-weight: 800; margin-bottom: 8px; }
  .clip-hero-excerpt { font-size: 13px; line-height: 1.7; color: var(--muted); margin: 0 0 14px; }
  .clip-hero-excerpt mark {
    background: var(--accent-dim);
    color: var(--accent);
    font-weight: 700;
    padding: 0 2px;
    border-radius: 3px;

  .clip-hero-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--faint);
    padding-top: 12px;
    border-top: 1px solid var(--border-soft);

  .clip-hero-footer a { color: var(--accent); text-decoration: none; font-weight: 600; }

  /* ---- top highlights: 매체별 가장 눈에 띄는 내용 ---- */
  .th-title-row {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 10px;

  .th-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border-soft);

  .th-row:last-child { border-bottom: none; padding-bottom: 0; }

  .th-link {

    display: flex;

  .th-link:hover { color: var(--accent); }
  .th-link .th-text {
    overflow: hidden;

  .th-empty { font-size: 12.5px; color: var(--faint); padding: 4px 0; }

  /* ---- source grid: one report card per platform ---- */
  .source-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
    margin-bottom: 8px;
  }
  .source-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px 8px;
  }
  .source-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-soft);
  }
  .source-swatch {
    width: 8px; height: 8px; border-radius: 2px;
    flex-shrink: 0;
  }
  .source-name { font-weight: 700; font-size: 14px; }
  .source-count {
    margin-left: auto;

  .source-item { padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--border-soft); }

  .si-title-row {

  .si-title {

  /* ---- product intro cards ---- */

    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;

  }
  .product-head {
    display: flex;

    padding: 16px 20px;

  .product-name { font-weight: 700; font-size: 14.5px; }
  .product-category {
    font-size: 11.5px;
    color: var(--faint);
  }
  .product-summary {
    font-size: 12.5px;
    color: var(--muted);
    margin-left: auto;
    overflow: hidden;
    text-overflow: ellipsis;

    font-size: 11px;

  .product-desc {

  .product-features {

    padding-left: 18px;

  .product-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;

  .product-link { color: var(--accent); text-decoration: none; font-weight: 600; }

  /* ---- archive (full list) ---- */
  .archive-toggle-wrap { text-align: center; margin: 20px 0 24px; }
  .archive-toggle {
    font-size: 12.5px;

    border: 1px solid var(--border);
    border-radius: 20px;

    cursor: pointer;
    transition: all 0.15s ease;

  .archive-toggle:hover { color: var(--text); border-color: #c7ccd6; }

  .pinned-section {
    margin-bottom: 20px;
    padding-bottom: 16px;

  }
  .section-label {

    font-weight: 700;

    margin-bottom: 10px;
  }
  .day-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    margin: 18px 0 8px;

  .day-group:first-child .day-label { margin-top: 0; }

  .notice-card {
    display: block;
    text-decoration: none;

    background: var(--panel);

  .platform-tag.gfa { background: #2f6fed14; color: var(--gfa); }
  .platform-tag.nosp { background: #12967a14; color: var(--nosp); }
  .platform-tag.common { background: #7c5cff14; color: var(--common); }
  .platform-tag.kakao { background: #a3760a14; color: var(--kakao); }
  .platform-tag.meta { background: #3b6fe014; color: var(--meta); }
  .platform-tag.nasmedia { background: #e0562f14; color: var(--nasmedia); }
  .platform-tag.toss { background: #0064ff14; color: var(--toss); }
  .platform-tag.tiktok { background: #d0195a14; color: var(--tiktok); }

  .cat-label {
    font-size: 11px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .new-flag {
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.02em;
    margin-left: auto;
    flex-shrink: 0;
    background: var(--accent-dim);
    padding: 2px 7px;
    border-radius: 4px;
  }
  .notice-title {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
  }
  .empty-state code {
    display: block;
    margin-top: 12px;
    background: var(--bg);

  @media (max-width: 480px) {
    .topbar { padding: 14px 16px; }
    .brand, .tab-btn, .live-chip { white-space: nowrap; }
    .live-chip { width: 100%; justify-content: flex-end; }
    .page-head { flex-direction: column; align-items: flex-start; }

    .week-select { flex-basis: 100%; order: 1; }
    .product-summary { display: none; }

</style>

<body>
<div class="topbar">
  <div class="brand">매체 공지 <span class="dot">모니터</span></div>
  <div class="tab-nav" id="tab-nav">
    <button class="tab-btn active" data-tab="news">매체소식</button>
    <button class="tab-btn" data-tab="products">매체 상품소개서</button>
  </div>
  <div class="live-chip"><span class="pulse-dot"></span>LIVE · <span id="new-count-chip"></span></div>
</div>
<div class="wrap">
  <div id="panel-news">
    <div class="page-head">
      <div>
        <h1>신규매체 소식</h1>
        <div class="page-sub" id="last-checked">마지막 확인 —</div>
      </div>
    </div>

    <div class="search-bar">
      <input type="text" class="search-input" id="search-input" placeholder="매체 소식 검색 (제목)">
      <button class="search-clear" id="search-clear">✕</button>
    </div>
    <div id="search-results"></div>

    <div id="browse-area">
      <div class="week-picker">
        <button class="week-nav-btn" id="week-prev" title="이전 주">◀</button>
        <select class="week-select" id="week-select"></select>
        <button class="week-nav-btn" id="week-next" title="다음 주">▶</button>
      </div>

      <div id="clip-hero-area"></div>
      <div id="top-highlights-area"></div>
      <div id="source-grid" class="source-grid"></div>
    </div>

    <div class="archive-toggle-wrap">
      <button class="archive-toggle" id="archive-toggle">전체 보관함 펼치기 ▾</button>
    </div>
    <div id="archive-area" style="display:none;">
      <div class="filters" id="filters"></div>
      <div id="pinned-area"></div>
      <div id="feed">
        <div class="empty-state">
          아직 수집된 데이터가 없어요. 먼저 크롤러를 실행해주세요.
          <code>python crawler.py</code>
        </div></div>
    </div>
  </div>

  <div id="panel-products" style="display:none;">
    <div class="page-head">
      <div>
        <h1>매체 상품소개서</h1>
        <div class="page-sub" id="products-last-updated">최근 업데이트 —</div>
      </div>
    </div>
    <div id="product-list" style="display:flex; flex-direction:column; gap:10px;"></div>
  </div>
</div>

<script>
const PLATFORM_CLASS = {
  '네이버 GFA': 'gfa',
  'NOSP': 'nosp',
  '카카오모먼트': 'kakao',
  '메타 for Business': 'meta',
  '나스미디어 뉴스클리핑': 'nasmedia',
  '나스미디어 광고상품업데이트': 'nasmedia',
  '토스애즈': 'toss',
  '틱톡 for Business': 'tiktok',
};
const CLIPPING_PLATFORM = '나스미디어 뉴스클리핑';
const SOURCE_ORDER = ['나스미디어 광고상품업데이트', '네이버 GFA', 'NOSP', '카카오모먼트', '메타 for Business', '토스애즈', '틱톡 for Business'];

let allNotices = [];
let activeFilter = '전체';
let clippings = [];
let selectedClipIndex = 0;

function formatKST(isoString) {
  const d = new Date(isoString);
  const opts = { month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Seoul' };
  return new Intl.DateTimeFormat('ko-KR', opts).format(d) + ' (KST)';
}

function escapeHTML(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// excerpt는 크롤러가 붙인 <mark> 하이라이트만 허용하고 나머지는 전부 이스케이프한다.
function excerptHTML(s) {
  return escapeHTML(s).replace(/&lt;mark&gt;/g, '<mark>').replace(/&lt;\/mark&gt;/g, '</mark>');
}

function cardHTML(n) {
  return `
    <a class="notice-card ${n.is_pinned ? 'pinned' : ''}" href="${n.url}" target="_blank" rel="noopener">
      <div class="card-top">
        <span class="platform-tag ${PLATFORM_CLASS[n.platform] || 'common'}">${escapeHTML(n.platform)}</span>
        <span class="cat-label">${escapeHTML(n.category)}</span>
        ${n.is_new ? '<span class="new-flag">NEW</span>' : ''}
      </div>
      <div class="notice-title">${escapeHTML(n.title)}</div>
    </a>`;
}

function renderFilters(platforms) {
  const el = document.getElementById('filters');
  const list = ['전체', ...platforms];
  el.innerHTML = list.map(p =>
    `<button class="filter-btn ${p === activeFilter ? 'active' : ''}" data-platform="${escapeHTML(p)}">${escapeHTML(p)}</button>`
  ).join('');
  el.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.platform;
      renderFilters(platforms);
      renderFeed();
    });
  });
}

function renderFeed() {
  const feed = document.getElementById('feed');
  const pinnedArea = document.getElementById('pinned-area');

  const filtered = activeFilter === '전체'
    ? allNotices
    : allNotices.filter(n => n.platform === activeFilter);

  if (filtered.length === 0) {
    pinnedArea.innerHTML = '';
    feed.innerHTML = '<div class="empty-state">해당 매체의 공지가 없어요.</div>';
    return;
  }

  const pinned = filtered.filter(n => n.is_pinned);
  const rest = filtered.filter(n => !n.is_pinned);

  pinnedArea.innerHTML = pinned.length ? `
    <div class="pinned-section">
      <div class="section-label">📌 고정 공지</div>
      ${pinned.map(cardHTML).join('')}
    </div>` : '';

  const groups = {};
  rest.forEach(n => { (groups[n.date] = groups[n.date] || []).push(n); });
  const dates = Object.keys(groups).sort().reverse();

  feed.innerHTML = dates.map(date => `
    <div class="day-group">
      <div class="day-label">${date}</div>
      ${groups[date].map(cardHTML).join('')}
    </div>
  `).join('');
}

// ---- 기간 조회: 나스미디어 뉴스클리핑 발행 주 기준 ----
// 클리핑은 그 다음주 월요일에 지난 한 주(월~일)를 정리해서 올라오므로,
// date(발행일) 기준으로 하루 전까지 역산한 7일을 "그 주"로 본다.
function parseDateOnly(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
function addDays(d, n) {
  const r = new Date(d);
  r.setUTCDate(r.getUTCDate() + n);
  return r;
}
function toDateStr(d) {
  return d.toISOString().slice(0, 10);
}
function weekRangeOf(clip) {
  const end = addDays(parseDateOnly(clip.date), -1);
  const start = addDays(end, -6);
  return { start: toDateStr(start), end: toDateStr(end) };
}

function renderWeekPicker() {
  const select = document.getElementById('week-select');
  select.innerHTML = clippings.map((c, i) =>
    `<option value="${i}" ${i === selectedClipIndex ? 'selected' : ''}>${escapeHTML(c.title)}</option>`
  ).join('');
  document.getElementById('week-prev').disabled = selectedClipIndex >= clippings.length - 1;
  document.getElementById('week-next').disabled = selectedClipIndex <= 0;
}

function renderClippingHero() {
  const area = document.getElementById('clip-hero-area');
  const clip = clippings[selectedClipIndex];
  if (!clip) { area.innerHTML = ''; return; }

  area.innerHTML = `
    <div class="card">
      <div class="clip-hero-eyebrow">
        <span>🗞️ 나스미디어 뉴스클리핑</span>
        ${clip.is_new ? '<span class="new-flag">NEW</span>' : ''}
      </div>
      <div class="clip-hero-title">${escapeHTML(clip.title)}</div>
      ${clip.excerpt ? `<p class="clip-hero-excerpt">${excerptHTML(clip.excerpt)}</p>` : ''}
      <div class="clip-hero-footer">
        <span>${clip.date} 발행 · ${clippings.length - selectedClipIndex} / ${clippings.length}주</span>
        <a href="${clip.url}" target="_blank" rel="noopener">전체 클리핑 읽기 ↗</a>
      </div>
    </div>`;
}

function renderTopHighlights() {
  const area = document.getElementById('top-highlights-area');
  const clip = clippings[selectedClipIndex];
  if (!clip) { area.innerHTML = ''; return; }
  const { start, end } = weekRangeOf(clip);

  const inRange = allNotices.filter(n =>
    n.platform !== CLIPPING_PLATFORM && n.date >= start && n.date <= end
  );

  const byPlatform = {};
  inRange.forEach(n => {
    const cur = byPlatform[n.platform];
    if (!cur || (n.is_pinned && !cur.is_pinned) || (n.is_pinned === cur.is_pinned && n.date > cur.date)) {
      byPlatform[n.platform] = n;
    }
  });

  const platforms = Object.keys(byPlatform).sort((a, b) => {
    const ia = SOURCE_ORDER.indexOf(a), ib = SOURCE_ORDER.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });

  const rowsHTML = platforms.length
    ? platforms.map(p => {
        const n = byPlatform[p];
        return `
          <div class="th-row">
            <a class="th-link" href="${n.url}" target="_blank" rel="noopener">
              <span class="platform-tag ${PLATFORM_CLASS[n.platform] || 'common'}">${escapeHTML(n.platform)}</span>
              <span class="th-text">${escapeHTML(n.title)}</span>
            </a>
            <span class="th-date">${n.date}</span>
          </div>`;
      }).join('')
    : '<div class="th-empty">선택한 주간(' + start + ' ~ ' + end + ')에는 다른 매체 소식이 없었어요.</div>';

  area.innerHTML = `
    <div class="card">
      <div class="th-title-row">📌 ${start} ~ ${end} · 매체별 가장 눈에 띄는 소식</div>
      ${rowsHTML}
    </div>`;
}

function renderBrowseArea() {
  const clip = clippings[selectedClipIndex];
  renderWeekPicker();
  renderClippingHero();
  renderTopHighlights();
  renderSourceGrid(clip ? weekRangeOf(clip) : null);
}

// ---- 검색 ----
function renderSearch(query) {
  const results = document.getElementById('search-results');
  const browse = document.getElementById('browse-area');
  const clearBtn = document.getElementById('search-clear');
  const q = query.trim().toLowerCase();

  clearBtn.style.display = q ? 'block' : 'none';

  if (!q) {
    results.innerHTML = '';
    browse.style.display = 'block';
    return;
  }
  browse.style.display = 'none';

  const matched = allNotices
    .filter(n => n.title.toLowerCase().includes(q))
    .sort((a, b) => b.date.localeCompare(a.date));

  results.innerHTML = matched.length
    ? `<div class="th-title-row">"${escapeHTML(query.trim())}" 검색 결과 ${matched.length}건</div>` + matched.map(cardHTML).join('')
    : `<div class="empty-state">"${escapeHTML(query.trim())}"에 대한 검색 결과가 없어요.</div>`;
}

function renderSourceGrid(range) {
  const grid = document.getElementById('source-grid');
  const platforms = [...new Set(allNotices.map(n => n.platform))]
    .filter(p => p !== CLIPPING_PLATFORM);
  platforms.sort((a, b) => {
    const ia = SOURCE_ORDER.indexOf(a), ib = SOURCE_ORDER.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });

  const byPlatform = platforms.map(platform => ({
    platform,
    items: allNotices
      .filter(n => n.platform === platform && (!range || (n.date >= range.start && n.date <= range.end)))
      .sort((a, b) => b.date.localeCompare(a.date))
      .slice(0, 3),
  }));

  // 기간 조회 중인데 전 매체에 소식이 하나도 없으면, 빈 카드를 잔뜩 늘어놓는 대신 안내 한 줄로 정리한다.
  if (range && byPlatform.every(p => p.items.length === 0)) {
    grid.innerHTML = `<div class="th-empty" style="grid-column:1/-1;">선택한 주간(${range.start} ~ ${range.end})에는 매체 소식이 없었어요.</div>`;
    return;
  }

  grid.innerHTML = byPlatform
    .filter(p => !range || p.items.length > 0)
    .map(({ platform, items }) => {
      const itemsHTML = items.length
        ? items.map(n => `
            <div class="source-item">
              <div class="si-title-row">
                <a class="si-title" href="${n.url}" target="_blank" rel="noopener">${escapeHTML(n.title)}</a>
                ${n.is_new ? '<span class="si-new">NEW</span>' : ''}
              </div>
              <div class="si-meta">${escapeHTML(n.category)} · ${n.date}</div>
              ${n.excerpt ? `<p class="si-excerpt">${excerptHTML(n.excerpt)}</p>` : ''}
            </div>`).join('')
        : `<div class="source-empty">최근 소식이 없어요.</div>`;

      return `
      <div class="source-card">
        <div class="source-head">
          <span class="source-swatch" style="background:var(--${PLATFORM_CLASS[platform] || 'common'})"></span>
          <span class="source-name">${escapeHTML(platform)}</span>
          <span class="source-count">${items.length}건</span>
        </div>
        ${itemsHTML}
      </div>`;
  }).join('');
}

function renderProducts(products) {
  const list = document.getElementById('product-list');
  if (!products.length) {
    list.innerHTML = `
      <div class="empty-state">
        아직 등록된 상품소개서가 없어요.<br>manual_input/products_raw.json 을 작성한 뒤 실행해주세요.
        <code>python manage_products.py</code>
      </div>`;
    return;
  }

  list.innerHTML = products.map(p => `
    <div class="product-card">
      <div class="product-head">
        <span class="product-swatch" style="background:var(--${PLATFORM_CLASS[p.platform] || 'common'})"></span>
        <span class="product-name">${escapeHTML(p.platform)}</span>
        <span class="product-category">${escapeHTML(p.category)}</span>
        <span class="product-summary">${escapeHTML(p.summary)}</span>
        <span class="product-chevron">▾</span>
      </div>
      <div class="product-detail">
        ${p.description ? `<p class="product-desc">${escapeHTML(p.description)}</p>` : ''}
        ${(p.features || []).length ? `<ul class="product-features">${p.features.map(f => `<li>${escapeHTML(f)}</li>`).join('')}</ul>` : ''}
        <div class="product-footer">
          <span>${p.updated_at ? '최근 업데이트 ' + p.updated_at : ''}</span>
          ${p.link ? `<a class="product-link" href="${p.link}" target="_blank" rel="noopener">자세히 보기 ↗</a>` : ''}
        </div>
      </div>
    </div>`).join('');

  list.querySelectorAll('.product-card').forEach(card => {
    card.querySelector('.product-head').addEventListener('click', () => {
      card.classList.toggle('open');
    });
  });
}

document.getElementById('tab-nav').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
  const isNews = btn.dataset.tab === 'news';
  document.getElementById('panel-news').style.display = isNews ? 'block' : 'none';
  document.getElementById('panel-products').style.display = isNews ? 'none' : 'block';
});

fetch('data/products.json')
  .then(res => {
    if (!res.ok) throw new Error('not found');
    return res.json();
  })
  .then(data => {
    const products = data.products || [];
    document.getElementById('products-last-updated').textContent = data.generated_at
      ? '최근 업데이트 — ' + formatKST(data.generated_at)
      : '최근 업데이트 —';
    renderProducts(products);
  })
  .catch(() => renderProducts([]));

document.getElementById('archive-toggle').addEventListener('click', () => {
  const area = document.getElementById('archive-area');
  const btn = document.getElementById('archive-toggle');
  const isHidden = area.style.display === 'none';
  area.style.display = isHidden ? 'block' : 'none';
  btn.textContent = isHidden ? '전체 보관함 접기 ▴' : '전체 보관함 펼치기 ▾';
});

document.getElementById('search-input').addEventListener('input', (e) => renderSearch(e.target.value));
document.getElementById('search-clear').addEventListener('click', () => {
  const input = document.getElementById('search-input');
  input.value = '';
  renderSearch('');
});
document.getElementById('week-select').addEventListener('change', (e) => {
  selectedClipIndex = Number(e.target.value);
  renderBrowseArea();
});
document.getElementById('week-prev').addEventListener('click', () => {
  if (selectedClipIndex < clippings.length - 1) { selectedClipIndex++; renderBrowseArea(); }
});
document.getElementById('week-next').addEventListener('click', () => {
  if (selectedClipIndex > 0) { selectedClipIndex--; renderBrowseArea(); }
});

fetch('data/notices.json')
  .then(res => {
    if (!res.ok) throw new Error('not found');
    return res.json();
  })
  .then(data => {
    allNotices = data.notices || [];
    document.getElementById('last-checked').textContent = '마지막 확인 — ' + formatKST(data.generated_at);
    const newCount = data.new_count || 0;
    document.getElementById('new-count-chip').innerHTML = newCount > 0
      ? `새 소식 <b>${newCount}</b>건`
      : '새 소식 없음';
    const platforms = [...new Set(allNotices.map(n => n.platform))];

    clippings = allNotices
      .filter(n => n.platform === CLIPPING_PLATFORM)
      .sort((a, b) => b.date.localeCompare(a.date));
    selectedClipIndex = 0;

    renderBrowseArea();
    renderFilters(platforms);
    renderFeed();
  })
  .catch(() => {
    document.getElementById('feed').innerHTML = `
      <div class="empty-state">
        아직 수집된 데이터가 없어요. 먼저 크롤러를 실행해주세요.
        <code>python crawler.py</code>
      </div>`;
  });
</script>
