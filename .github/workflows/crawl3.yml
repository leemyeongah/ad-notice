name: 매체 공지 크롤링

on:
  schedule:
    # UTC 기준 매주 화요일 0시 = 한국시간(UTC+9) 화요일 오전 9시
    # (나스미디어 뉴스클리핑이 월요일 중 늦게 올라올 때가 있어서 하루 늦춰서 확실히 잡음)
    - cron: '0 0 * * 2'
  workflow_dispatch: {}  # Actions 탭에서 수동으로도 실행 가능

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests

      - name: 크롤러 실행
        run: python crawler.py

      - name: 변경사항 커밋
        run: |
          git config user.name "notice-bot"
          git config user.email "notice-bot@users.noreply.github.com"
          git add data/notices.json
          git diff --cached --quiet || git commit -m "chore: 공지 데이터 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
