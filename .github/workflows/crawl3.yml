name: 매체 공지 크롤링

on:
  schedule:
    # UTC 기준 매주 화요일 0시 17분 = 한국시간(UTC+9) 화요일 오전 9시 17분
    # (나스미디어 뉴스클리핑이 월요일 중 늦게 올라올 때가 있어서 하루 늦춰서 확실히 잡음)
    # 정각(0분)엔 전 세계 저장소가 몰려서 실행이 몇 시간씩 밀리는 경우가 잦아, 애매한 분으로 옮겨둠
    - cron: '17 0 * * 2'
  workflow_dispatch: {}  # Actions 탭에서 수동으로도 실행 가능

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests

      - name: 크롤러 실행
        run: python crawler.py

      - name: 매체 상품소개서 시트 동기화
        env:
          PRODUCTS_SHEET_URL: ${{ secrets.PRODUCTS_SHEET_URL }}
        run: python sync_products.py

      - name: 변경사항 커밋
        run: |
          git config user.name "notice-bot"
          git config user.email "notice-bot@users.noreply.github.com"
          git add data/notices.json data/pending_slack_notification.json data/products.json manual_input/products_raw.json
          git diff --cached --quiet || git commit -m "chore: 공지 데이터 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
