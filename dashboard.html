<!DOCTYPE html>
<!-- saved from url=(0054)file:///C:/Users/wisebirds/Downloads/dashboard_10.html -->
<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매체 신규 소식 - ACD1-T2용</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link href="./dashboard_files/css2" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel-hover: #fbfbfc;
    --page: #ffffff;
    --border: #e6e8ec;
    --border-soft: #eef0f3;
    --text: #1a1d24;
    --muted: #6b7280;
    --faint: #9aa1ac;
    --accent: #2f6fed;
    --accent-dim: rgba(47,111,237,0.08);
    /* 매체별 고유색: 서로 겹치지 않는 하나의 계통색 세트에서만 골라 쓴다(파란색은 accent 전용). */
    --gfa: #059669;
    --nosp: #0d9488;
    --kakao: #b45309;
    --meta: #7c3aed;
    --toss: #db2777;
    --tiktok: #334155;
    /* 나스미디어 소식 2건은 개별 매체가 아니라 요약성 소식이라 톤을 낮춘 무채색 계열을 쓴다. */
    --adupdate: #78716c;
    --clipping: #a8a29e;
    --common: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px 16px;
    padding: 16px 28px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  .brand .dot { color: var(--accent); }
  .live-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .live-chip .pulse-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(47,111,237,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(47,111,237,0); }
    100% { box-shadow: 0 0 0 0 rgba(47,111,237,0); }
  }
  .live-chip b { color: var(--accent); font-weight: 700; }

  .tab-nav { display: flex; gap: 4px; }
  .tab-btn {
    font-size: 13px;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 20px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
  }

  .layout {
    max-width: 1240px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }

  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 24px;
  }
  .page-head h1 {
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }
  .page-sub {
    font-size: 12px;
    color: var(--muted);
  }

  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .filter-btn {
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .filter-btn:hover { border-color: #c7ccd6; color: var(--text); }
  .filter-btn.active {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 16px;
  }

  /* ---- search ---- */
  .search-bar { position: relative; margin-bottom: 16px; }
  .search-input {
    width: 100%;
    font-size: 13px;
    font-family: inherit;
    padding: 11px 36px 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
  }
  .search-input:focus { outline: none; border-color: var(--accent); }
  .search-clear {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    color: var(--faint);
    font-size: 15px;
    cursor: pointer;
    display: none;
  }

  /* ---- week picker (나스미디어 뉴스클리핑 발행 주 기준 기간 조회) ---- */
  .week-picker {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
  }
  .week-nav-btn {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
  }
  .week-nav-btn:hover:not(:disabled) { border-color: #c7ccd6; color: var(--text); }
  .week-nav-btn:disabled { opacity: 0.35; cursor: default; }
  .week-select {
    flex: 1;
    font-size: 13px;
    font-family: inherit;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
  }

  /* ---- clipping hero ---- */
  .clip-hero-eyebrow {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--clipping);
    margin-bottom: 10px;
  }
  .clip-hero-title { font-size: 16px; font-weight: 800; margin-bottom: 8px; }
  .clip-hero-excerpt { font-size: 13px; line-height: 1.7; color: var(--muted); margin: 0 0 14px; }
  .clip-hero-excerpt mark {
    background: var(--accent-dim);
    color: var(--accent);
    font-weight: 700;
    padding: 0 2px;
    border-radius: 3px;
  }
  .clip-highlights {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin: 0 0 16px;
  }
  .ch-row { display: flex; align-items: baseline; gap: 10px; }
  .ch-platform { flex-shrink: 0; width: 72px; font-size: 12px; font-weight: 700; }
  .ch-headline { font-size: 13px; color: var(--text); line-height: 1.5; }
  .clip-hero-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--faint);
    padding-top: 12px;
    border-top: 1px solid var(--border-soft);
  }
  .clip-hero-footer a { color: var(--accent); text-decoration: none; font-weight: 600; }

  /* ---- notice row: 한 줄짜리 소식(보관함/검색/카드 내 보조 항목 공용) ---- */
  .th-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border-soft);
  }
  .th-row:last-child { border-bottom: none; padding-bottom: 0; }
  .th-row:first-child { padding-top: 0; }
  .th-link {
    flex: 1;
    display: flex;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
    text-decoration: none;
    color: var(--text);
  }
  .th-link:hover { color: var(--accent); }
  .th-link .th-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .th-date { flex-shrink: 0; font-size: 11px; color: var(--faint); }
  .th-empty { font-size: 12px; color: var(--faint); padding: 4px 0; }

  /* ---- source grid: 매체별 소식 카드 (헤드라인 1건 + 나머지는 한 줄 요약) ---- */
  .section-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .source-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
    margin-bottom: 8px;
  }
  .source-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px 8px;
  }
  .source-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-soft);
  }
  .source-swatch {
    width: 8px; height: 8px; border-radius: 2px;
    flex-shrink: 0;
  }
  .source-name { font-weight: 700; font-size: 14px; }
  .source-count {
    margin-left: auto;
    font-size: 11px;
    color: var(--faint);
  }
  .source-freshness {
    display: block;
    font-size: 11px;
    color: var(--faint);
    margin: -8px 0 12px;
  }
  .source-freshness.stale { color: #d97a1f; font-weight: 600; }
  /* 지난 방문 이후 새 글 표시 (브라우저 로컬 기준, NEW 배지와는 다른 개념) */
  .unseen-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }
  .th-link.is-unseen .th-text, .sh-title.is-unseen { font-weight: 800; }

  /* 카드당 가장 최근 소식 1건은 헤드라인으로 크게, 나머지는 .th-row로 압축해서 보여준다. */
  .source-headline { margin-bottom: 4px; }
  .sh-title-row { display: flex; align-items: baseline; gap: 8px; }
  .sh-title {
    text-decoration: none;
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    line-height: 1.45;
  }
  .sh-title:hover { color: var(--accent); }
  .si-new {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-dim);
    padding: 1px 6px;
    border-radius: 4px;
  }
  .si-meta {
    font-size: 11px;
    color: var(--faint);
    margin: 4px 0 6px;
  }
  .si-excerpt {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
    margin: 0;
  }
  .si-excerpt mark {
    background: var(--accent-dim);
    color: var(--accent);
    font-weight: 700;
    padding: 0 2px;
    border-radius: 3px;
  }
  .source-rest {
    margin-top: 12px;
    padding-top: 2px;
    border-top: 1px solid var(--border-soft);
  }
  .source-rest .th-row { padding: 8px 0; }
  .source-empty {
    font-size: 12px;
    color: var(--faint);
    padding: 6px 0 14px;
  }

  /* ---- product intro: stats + filter pills + card grid ---- */
  .stats-row {
    display: flex;
    gap: 32px;
    margin-bottom: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .stat-block { display: flex; flex-direction: column; gap: 2px; }
  .stat-number { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .stat-label { font-size: 11px; color: var(--muted); }

  .product-meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin: 4px 0 12px;
  }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 14px;
  }
  .product-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    cursor: pointer;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .product-card:hover { border-color: #c7ccd6; box-shadow: 0 4px 16px rgba(20,23,30,0.06); }
  .pc-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .pc-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pc-icon {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .pc-name {
    font-weight: 700;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pc-badge {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .pc-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
    margin: 0 0 14px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 3.2em;
  }
  .pc-footer {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--faint);
    padding-top: 10px;
    border-top: 1px solid var(--border-soft);
  }
  .pc-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .pc-dot.fresh { background: #2f9e44; }
  .pc-dot.stale { background: #e8a33d; }
  .pc-dot.old { background: #b9bfc9; }

  /* ---- bottom sheet ---- */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20,23,30,0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 900;
  }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
  .bottom-sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    margin: 0 auto;
    max-width: 560px;
    max-height: 78vh;
    background: var(--panel);
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -12px 32px rgba(20,23,30,0.18);
    transform: translateY(100%);
    transition: transform 0.25s ease;
    z-index: 901;
    display: flex;
    flex-direction: column;
  }
  .bottom-sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    margin: 10px auto 4px;
    flex-shrink: 0;
  }
  .sheet-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px 12px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
  }
  .sheet-swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 8px; }
  .sheet-name { font-weight: 800; font-size: 16px; }
  .sheet-category { display: block; font-size: 11px; color: var(--faint); margin: 4px 0 0 16px; }
  .sheet-close {
    flex-shrink: 0;
    border: none;
    background: var(--bg);
    color: var(--muted);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 13px;
    cursor: pointer;
  }
  .sheet-close:hover { color: var(--text); }
  .sheet-body { padding: 16px 20px 24px; overflow-y: auto; }
  .product-desc {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
    margin: 0 0 12px;
    white-space: pre-line;
  }
  .product-features {
    margin: 0 0 14px;
    padding-left: 18px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.8;
  }
  .copy-email-btn {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-dim);
    border: none;
    border-radius: 5px;
    padding: 1px 7px;
    margin-left: 4px;
    cursor: pointer;
  }
  .copy-email-btn:hover { opacity: 0.8; }
  .pdf-embed {
    margin: 0 0 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg);
  }
  .pdf-embed iframe { width: 100%; height: 360px; border: none; display: block; }
  .pdf-embed-note { font-size: 11px; color: var(--faint); margin: 0 0 14px; }
  .product-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--faint);
    padding-top: 12px;
    border-top: 1px solid var(--border-soft);
  }
  .product-link { color: var(--accent); text-decoration: none; font-weight: 600; }
  .product-link:hover { text-decoration: underline; }

  /* ---- archive (full list) ---- */
  .archive-toggle-wrap { text-align: center; margin: 20px 0 24px; }
  .archive-toggle {
    font-size: 12px;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 18px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .archive-toggle:hover { color: var(--text); border-color: #c7ccd6; }

  .week-group { margin-bottom: 12px; }

  .platform-tag {
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 5px;
    letter-spacing: 0.01em;
    flex-shrink: 0;
  }
  .platform-tag.gfa { background: rgba(5,150,105,0.12); color: var(--gfa); }
  .platform-tag.nosp { background: rgba(13,148,136,0.12); color: var(--nosp); }
  .platform-tag.kakao { background: rgba(180,83,9,0.12); color: var(--kakao); }
  .platform-tag.meta { background: rgba(124,58,237,0.12); color: var(--meta); }
  .platform-tag.toss { background: rgba(219,39,119,0.12); color: var(--toss); }
  .platform-tag.tiktok { background: rgba(51,65,85,0.12); color: var(--tiktok); }
  .platform-tag.adupdate { background: rgba(120,113,108,0.12); color: var(--adupdate); }
  .platform-tag.clipping { background: rgba(168,162,158,0.16); color: var(--clipping); }
  .platform-tag.common { background: rgba(100,116,139,0.12); color: var(--common); }

  .new-flag {
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.02em;
    margin-left: auto;
    flex-shrink: 0;
    background: var(--accent-dim);
    padding: 2px 7px;
    border-radius: 4px;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
  }
  .empty-state code {
    display: block;
    margin-top: 12px;
    background: var(--bg);
    padding: 10px 14px;
    border-radius: 6px;
    color: var(--accent);
  }

  @media (max-width: 480px) {
    .topbar { padding: 14px 16px; }
    .brand, .tab-btn, .live-chip { white-space: nowrap; }
    .live-chip { width: 100%; justify-content: flex-end; }
    .page-head { flex-direction: column; align-items: flex-start; }
    .week-picker { flex-wrap: wrap; }
    .week-select { flex-basis: 100%; order: 1; }
    .stats-row { gap: 20px; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">매체 신규 소식 <span class="dot">- ACD1-T2용</span></div>
  <div class="tab-nav" id="tab-nav">
    <button class="tab-btn active" data-tab="news">매체소식</button>
    <button class="tab-btn" data-tab="products">매체 상품소개서</button>
  </div>
  <div class="live-chip"><span class="pulse-dot"></span>LIVE · <span id="new-count-chip"></span></div>
</div>
<div class="layout">
  <div class="wrap">
  <div id="panel-news">
    <div class="page-head">
      <div>
        <h1>매체 소식</h1>
        <div class="page-sub" id="last-checked">마지막 확인 —</div>
      </div>
    </div>

    <div class="search-bar">
      <input type="text" class="search-input" id="search-input" placeholder="매체 소식 검색 (제목)">
      <button class="search-clear" id="search-clear">✕</button>
    </div>
    <div id="search-results"></div>

    <div id="browse-area">
      <div class="week-picker">
        <button class="week-nav-btn" id="week-prev" title="이전 주">◀</button>
        <select class="week-select" id="week-select"></select>
        <button class="week-nav-btn" id="week-next" title="다음 주">▶</button>
      </div>

      <div id="clip-hero-area"></div>
      <div class="section-label" id="source-grid-label"></div>
      <div id="source-grid" class="source-grid"></div>
    </div>

    <div class="archive-toggle-wrap">

          아직 수집된 데이터가 없어요. 먼저 크롤러를 실행해주세요.

<script>
const PLATFORM_CLASS = {
  '네이버 GFA': 'gfa',
  'NOSP': 'nosp',
  '카카오모먼트': 'kakao',
  '메타 for Business': 'meta',
  '나스미디어 뉴스클리핑': 'clipping',
  '나스미디어 광고상품업데이트': 'adupdate',
  '토스애즈': 'toss',
  '틱톡 for Business': 'tiktok',
};
const CLIPPING_PLATFORM = '나스미디어 뉴스클리핑';
// 나스미디어 소식 2건(광고상품 업데이트, 뉴스클리핑)은 개별 매체가 아니라 요약성 소식이라
// 정렬 시 항상 맨 뒤로 보낸다.
const SOURCE_ORDER = ['네이버 GFA', 'NOSP', '카카오모먼트', '메타 for Business', '토스애즈', '틱톡 for Business', '나스미디어 광고상품업데이트', '나스미디어 뉴스클리핑'];
// 매체 이름은 원본 데이터(n.platform) 그대로 두고, 화면 표시용 짧은 이름만 따로 매핑한다.
const PLATFORM_LABEL = {
  '나스미디어 뉴스클리핑': '클리핑',
  '나스미디어 광고상품업데이트': '광고상품 업데이트',
};
function platformLabel(p) {
  return PLATFORM_LABEL[p] || p;
}

let allNotices = [];
let activeFilter = '전체';
let clippings = [];
let selectedClipIndex = 0;

// 지난 방문 이후 새로 올라온 글 표시용 (브라우저에만 저장, 서버 필요 없음)
// 프라이빗 브라우징 등 localStorage가 막힌 환경에서도 페이지 전체가 죽지 않도록 방어.
const LAST_VISIT_KEY = 'adnotice_last_visit';
let prevVisitAt = null; // 이전 방문 시각(ISO) 또는 null(첫 방문/스토리지 접근 불가)
try {
  prevVisitAt = localStorage.getItem(LAST_VISIT_KEY);
} catch (e) {
  /* localStorage 접근 불가 - unseen 표시 없이 계속 진행 */
}
function isUnseen(n) {
  return !!prevVisitAt && n.date > prevVisitAt.slice(0, 10);
}

// 캠페인에 실제 영향 줄 만한 키워드가 제목에 있으면 ⚠️로 눈에 띄게 표시
const IMPORTANT_KEYWORDS = ['정책', '종료', '필수', '변경', '중단', '차단', '마감'];
function isImportant(title) {
  return IMPORTANT_KEYWORDS.some(k => (title || '').includes(k));
}

function daysAgo(dateStr) {
  if (!dateStr) return null;
  return Math.floor((Date.now() - parseDateOnly(dateStr).getTime()) / 86400000);
}

function formatKST(isoString) {
  const d = new Date(isoString);
  const opts = { month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Seoul' };
  return new Intl.DateTimeFormat('ko-KR', opts).format(d) + ' (KST)';
}

function escapeHTML(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// excerpt는 크롤러가 붙인 <mark> 하이라이트만 허용하고 나머지는 전부 이스케이프한다.
function excerptHTML(s) {
  return escapeHTML(s).replace(/&lt;mark&gt;/g, '<mark>').replace(/&lt;\/mark&gt;/g, '</mark>');
}

function noticeRowHTML(n) {
  return `
    <div class="th-row">
      <a class="th-link ${isUnseen(n) ? 'is-unseen' : ''}" href="${n.url}" target="_blank" rel="noopener">
        ${isUnseen(n) ? '<span class="unseen-dot" title="지난 방문 이후 새 글"></span>' : ''}
        <span class="platform-tag ${PLATFORM_CLASS[n.platform] || 'common'}">${escapeHTML(platformLabel(n.platform))}</span>
        ${n.is_pinned ? '<span title="고정 공지">📌</span>' : ''}
        ${isImportant(n.title) ? '<span title="캠페인에 영향 줄 수 있는 소식">⚠️</span>' : ''}
        <span class="th-text">${escapeHTML(n.title)}</span>
        ${n.is_new ? '<span class="new-flag">NEW</span>' : ''}
      </a>
      <span class="th-date">${n.date}</span>
    </div>`;
}

// 매체별 소식 카드에서 가장 최근 소식 1건을 헤드라인으로 크게 보여줄 때 쓰는 마크업.
function sourceHeadlineHTML(n) {
  return `
    <div class="source-headline">
      <div class="sh-title-row">
        <a class="sh-title ${isUnseen(n) ? 'is-unseen' : ''}" href="${n.url}" target="_blank" rel="noopener">
          ${isUnseen(n) ? '<span class="unseen-dot" title="지난 방문 이후 새 글"></span>' : ''}
          ${n.is_pinned ? '<span title="고정 공지">📌</span>' : ''}
          ${isImportant(n.title) ? '<span title="캠페인에 영향 줄 수 있는 소식">⚠️</span>' : ''}
          ${escapeHTML(n.title)}
        </a>
        ${n.is_new ? '<span class="si-new">NEW</span>' : ''}
      </div>
      <div class="si-meta">${escapeHTML(n.category)} · ${n.date}</div>
      ${n.excerpt ? `<p class="si-excerpt">${excerptHTML(n.excerpt)}</p>` : ''}
    </div>`;
}

function renderFilters(platforms) {
  const el = document.getElementById('filters');
  const sorted = [...platforms].sort((a, b) => {
    const ia = SOURCE_ORDER.indexOf(a), ib = SOURCE_ORDER.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });
  const list = ['전체', ...sorted];
  el.innerHTML = list.map(p =>
    `<button class="filter-btn ${p === activeFilter ? 'active' : ''}" data-platform="${escapeHTML(p)}">${escapeHTML(p === '전체' ? p : platformLabel(p))}</button>`
  ).join('');
  el.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.platform;
      renderFilters(platforms);
      renderFeed();
    });
  });
}

function renderFeed() {
  const feed = document.getElementById('feed');
  const pinnedArea = document.getElementById('pinned-area');

  const filtered = activeFilter === '전체'
    ? allNotices
    : allNotices.filter(n => n.platform === activeFilter);

  if (filtered.length === 0) {
    pinnedArea.innerHTML = '';
    feed.innerHTML = '<div class="empty-state">해당 매체의 공지가 없어요.</div>';
    return;
  }

  const pinned = filtered.filter(n => n.is_pinned);
  const rest = filtered.filter(n => !n.is_pinned);

  pinnedArea.innerHTML = pinned.length ? `
    <div class="card">
      <div class="section-label">📌 고정 공지</div>
      ${pinned.map(noticeRowHTML).join('')}
    </div>` : '';

  // 요일별로 잘게 쪼개는 대신, 매체소식 탭과 같은 "한 주" 단위로 묶어서
  // "이번 주엔 뭐가 있었지"를 스캔하기 쉽게 보여준다.
  const groups = {};
  rest.forEach(n => { const wk = mondayOf(n.date); (groups[wk] = groups[wk] || []).push(n); });
  const mondays = Object.keys(groups).sort().reverse();

  feed.innerHTML = mondays.map(monday => {
    const sunday = toDateStr(addDays(parseDateOnly(monday), 6));
    const items = groups[monday].sort((a, b) => b.date.localeCompare(a.date));
    return `
      <div class="card week-group">
        <div class="section-label">${formatMD(monday)} ~ ${formatMD(sunday)} · ${items.length}건</div>
        ${items.map(noticeRowHTML).join('')}
      </div>`;
  }).join('');
}

// ---- 기간 조회: 나스미디어 뉴스클리핑 발행 주 기준 ----
// 클리핑은 그 다음주 월요일에 지난 한 주(월~일)를 정리해서 올라오므로,
// date(발행일) 기준으로 하루 전까지 역산한 7일을 "그 주"로 본다.
function parseDateOnly(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
function addDays(d, n) {
  const r = new Date(d);
  r.setUTCDate(r.getUTCDate() + n);
  return r;
}
function toDateStr(d) {
  return d.toISOString().slice(0, 10);
}
function weekRangeOf(clip) {
  const end = addDays(parseDateOnly(clip.date), -1);
  const start = addDays(end, -6);
  return { start: toDateStr(start), end: toDateStr(end) };
}
// 보관함용 월요일 시작 주 단위 그룹핑(뉴스클리핑 발행 주기와는 무관하게, 달력 기준 월~일)
function mondayOf(dateStr) {
  const d = parseDateOnly(dateStr);
  const dow = d.getUTCDay(); // 0=일 ... 6=토
  const diff = dow === 0 ? -6 : 1 - dow;
  return toDateStr(addDays(d, diff));
}
function formatMD(dateStr) {
  const [, m, d] = dateStr.split('-').map(Number);
  return `${m}월 ${d}일`;
}

function renderWeekPicker() {
  const select = document.getElementById('week-select');
  select.innerHTML = clippings.map((c, i) =>
    `<option value="${i}" ${i === selectedClipIndex ? 'selected' : ''}>${escapeHTML(c.title)}</option>`
  ).join('');
  document.getElementById('week-prev').disabled = selectedClipIndex >= clippings.length - 1;
  document.getElementById('week-next').disabled = selectedClipIndex <= 0;
}

// 매체별 핵심(highlights)이 있으면 그걸로, 없으면(최신 3건 밖의 과거 클리핑) 예전처럼
// 잘린 요약 문단으로 보여준다.
function renderClipHighlightsOrExcerpt(clip) {
  if (clip.highlights && clip.highlights.length) {
    return `<div class="clip-highlights">${clip.highlights.map(h => `
      <div class="ch-row">
        <span class="ch-platform" style="color:${categoryColor(h.platform)}">${escapeHTML(h.platform)}</span>
        <span class="ch-headline">${escapeHTML(h.headline)}</span>
      </div>`).join('')}</div>`;
  }
  return clip.excerpt ? `<p class="clip-hero-excerpt">${excerptHTML(clip.excerpt)}</p>` : '';
}

function renderClippingHero() {
  const area = document.getElementById('clip-hero-area');
  const clip = clippings[selectedClipIndex];
  if (!clip) { area.innerHTML = ''; return; }

  area.innerHTML = `
    <div class="card">
      <div class="clip-hero-eyebrow">
        <span>🗞️ ${escapeHTML(platformLabel(CLIPPING_PLATFORM))}</span>
        ${clip.is_new ? '<span class="new-flag">NEW</span>' : ''}
      </div>
      <div class="clip-hero-title">${escapeHTML(clip.title)}</div>
      ${renderClipHighlightsOrExcerpt(clip)}
      <div class="clip-hero-footer">
        <span>${clip.date} 발행 · ${clippings.length - selectedClipIndex} / ${clippings.length}주</span>
        <a href="${clip.url}" target="_blank" rel="noopener">전체 클리핑 읽기 ↗</a>
      </div>
    </div>`;
}

function renderBrowseArea() {
  const clip = clippings[selectedClipIndex];
  renderWeekPicker();
  renderClippingHero();
  renderSourceGrid(clip ? weekRangeOf(clip) : null);
}

// ---- 검색 ----
function renderSearch(query) {
  const results = document.getElementById('search-results');
  const browse = document.getElementById('browse-area');
  const clearBtn = document.getElementById('search-clear');
  const q = query.trim().toLowerCase();

  clearBtn.style.display = q ? 'block' : 'none';

  if (!q) {
    results.innerHTML = '';
    browse.style.display = 'block';
    return;
  }
  browse.style.display = 'none';

  const matched = allNotices
    .filter(n => n.title.toLowerCase().includes(q))
    .sort((a, b) => b.date.localeCompare(a.date));

  results.innerHTML = matched.length
    ? `<div class="card"><div class="section-label">"${escapeHTML(query.trim())}" 검색 결과 ${matched.length}건</div>${matched.map(noticeRowHTML).join('')}</div>`
    : `<div class="empty-state">"${escapeHTML(query.trim())}"에 대한 검색 결과가 없어요.</div>`;
}

// 매체별 소식 카드: 가장 최근 소식 1건은 헤드라인으로, 나머지 최대 2건은 한 줄 요약으로 보여준다.
// (예전엔 "매체별 가장 눈에 띄는 소식" 카드를 이 위에 따로 두었는데, 같은 정보를 두 번 보여주는
// 셈이라 하나로 합쳤다.)
function renderSourceGrid(range) {
  const label = document.getElementById('source-grid-label');
  const grid = document.getElementById('source-grid');
  const platforms = [...new Set(allNotices.map(n => n.platform))]
    .filter(p => p !== CLIPPING_PLATFORM);
  platforms.sort((a, b) => {
    const ia = SOURCE_ORDER.indexOf(a), ib = SOURCE_ORDER.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });

  const byPlatform = platforms.map(platform => ({
    platform,
    items: allNotices
      .filter(n => n.platform === platform && (!range || (n.date >= range.start && n.date <= range.end)))
      .sort((a, b) => b.date.localeCompare(a.date))
      .slice(0, 3),
  }));

  label.textContent = range ? `📌 ${range.start} ~ ${range.end} · 매체별 소식` : '📌 매체별 소식';

  // 기간 조회 중인데 전 매체에 소식이 하나도 없으면, 빈 카드를 잔뜩 늘어놓는 대신 안내 한 줄로 정리한다.
  if (range && byPlatform.every(p => p.items.length === 0)) {
    grid.innerHTML = `<div class="th-empty" style="grid-column:1/-1;">선택한 주간(${range.start} ~ ${range.end})에는 매체 소식이 없었어요.</div>`;
    return;
  }

  grid.innerHTML = byPlatform
    .filter(p => !range || p.items.length > 0)
    .map(({ platform, items }) => {
      const bodyHTML = items.length
        ? sourceHeadlineHTML(items[0]) + (items.length > 1
            ? `<div class="source-rest">${items.slice(1).map(noticeRowHTML).join('')}</div>`
            : '')
        : `<div class="source-empty">최근 소식이 없어요.</div>`;

      const latestDate = allNotices
        .filter(n => n.platform === platform)
        .reduce((max, n) => (n.date > max ? n.date : max), '');
      const staleDays = daysAgo(latestDate);
      const freshnessHTML = staleDays === null ? '' : (
        staleDays > 30
          ? `<span class="source-freshness stale">${staleDays}일 전 업데이트</span>`
          : `<span class="source-freshness">${staleDays === 0 ? '오늘' : staleDays + '일 전'} 업데이트</span>`
      );

      return `
      <div class="source-card">
        <div class="source-head">
          <span class="source-swatch" style="background:var(--${PLATFORM_CLASS[platform] || 'common'})"></span>
          <span class="source-name">${escapeHTML(platformLabel(platform))}</span>
          <span class="source-count">${items.length}건</span>
        </div>
        ${freshnessHTML}
        ${bodyHTML}
      </div>`;
  }).join('');
}

let allProducts = [];
let activeProductFilter = '전체';
let productSearchQuery = '';

const CATEGORY_ICON = {
  'DSP': '🎯', 'SNS': '💬', 'DA': '📊', 'Video': '🎬', '보상형': '🎁', 'OOH': '🚏',
  'DMP': '🗂️', 'App': '📱', '비즈니스': '💼', '로컬': '📍', 'CTV': '📺', '리타기팅': '🔁',
  '네이티브': '🧩', '기타': '🔹', 'SA': '🔎', '오프라인': '🏬',
};
// 매체 태그와 같은 계통의 색 세트를 공유해서(플랫폼 색 + 상품 카테고리 색) 화면 전체가
// 하나의 색 시스템처럼 느껴지게 한다.
const CATEGORICAL_PALETTE = ['#059669', '#0d9488', '#0891b2', '#4f46e5', '#7c3aed', '#db2777', '#dc2626', '#b45309', '#65a30d', '#334155'];

function categoryTokens(p) {
  return (p.category || '기타').split(',').map(s => s.trim()).filter(Boolean);
}
function primaryCategory(p) {
  return categoryTokens(p)[0] || '기타';
}
function categoryColor(cat) {
  let hash = 0;
  for (let i = 0; i < cat.length; i++) hash = (hash * 31 + cat.charCodeAt(i)) >>> 0;
  return CATEGORICAL_PALETTE[hash % CATEGORICAL_PALETTE.length];
}
function categoryIcon(cat) {
  return CATEGORY_ICON[cat] || '🏷️';
}
// "최근 업데이트 기준: 2025.11" 같은 실제 콘텐츠 기준일을 features에서 찾고,
// 없으면 스크립트가 마지막으로 반영한 날짜(updated_at)로 대체한다.
function extractUpdateNote(p) {
  const found = (p.features || []).map(f => f.match(/기준:\s*([\d.]+)/)).find(Boolean);
  return found ? found[1] : (p.updated_at || '');
}
function parseUpdateDate(s) {
  if (!s) return null;
  const parts = s.split(/[.\-]/).map(Number).filter(n => !isNaN(n));
  if (parts.length < 2) return null;
  return new Date(parts[0], (parts[1] || 1) - 1, parts[2] || 1);
}
function freshnessClass(dateObj) {
  if (!dateObj) return 'old';
  const days = (Date.now() - dateObj.getTime()) / 86400000;
  if (days <= 60) return 'fresh';
  if (days <= 180) return 'stale';
  return 'old';
}

function renderProducts(products) {
  allProducts = products;
  activeProductFilter = '전체';
  renderProductStats();
  renderProductFilters();
  renderProductGrid();
}

function renderProductStats() {
  const el = document.getElementById('product-stats');
  const catSet = new Set();
  allProducts.forEach(p => categoryTokens(p).forEach(c => catSet.add(c)));
  el.innerHTML = `
    <div class="stat-block"><span class="stat-number">${allProducts.length}</span><span class="stat-label">등록된 매체</span></div>
    <div class="stat-block"><span class="stat-number" style="color:var(--accent)">${catSet.size}</span><span class="stat-label">매체 카테고리</span></div>`;
}

function renderProductFilters() {
  const el = document.getElementById('product-filters');
  const counts = {};
  allProducts.forEach(p => categoryTokens(p).forEach(c => { counts[c] = (counts[c] || 0) + 1; }));
  const cats = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b));

  el.innerHTML = ['전체', ...cats].map(c => {
    const count = c === '전체' ? allProducts.length : counts[c];
    return `<button class="filter-btn ${c === activeProductFilter ? 'active' : ''}" data-cat="${escapeHTML(c)}">${escapeHTML(c)} ${count}</button>`;
  }).join('');

  el.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeProductFilter = btn.dataset.cat;
      renderProductFilters();
      renderProductGrid();
    });
  });
}

function renderProductGrid() {
  const grid = document.getElementById('product-list');
  const metaRow = document.getElementById('product-meta-row');

  if (!allProducts.length) {
    metaRow.innerHTML = '';
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        아직 등록된 상품소개서가 없어요.<br>manual_input/products_raw.json 을 작성한 뒤 실행해주세요.
        <code>python manage_products.py</code>
      </div>`;
    return;
  }

  const byCategory = activeProductFilter === '전체'
    ? allProducts
    : allProducts.filter(p => categoryTokens(p).includes(activeProductFilter));

  const q = productSearchQuery.trim().toLowerCase();
  const filtered = q
    ? byCategory.filter(p =>
        p.platform.toLowerCase().includes(q) ||
        (p.description || '').toLowerCase().includes(q) ||
        (p.summary || '').toLowerCase().includes(q))
    : byCategory;

  metaRow.innerHTML = `<span>전체 매체 ${filtered.length}개</span>`;

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">"${escapeHTML(productSearchQuery.trim())}"에 대한 검색 결과가 없어요.</div>`;
    return;
  }

  grid.innerHTML = filtered.map(p => {
    const cat = primaryCategory(p);
    const color = categoryColor(cat);
    const note = extractUpdateNote(p);
    const fresh = freshnessClass(parseUpdateDate(note));
    return `
      <div class="product-card" data-index="${allProducts.indexOf(p)}">
        <div class="pc-head">
          <div class="pc-title">
            <span class="pc-icon" style="background:${color}1f;">${categoryIcon(cat)}</span>
            <span class="pc-name">${escapeHTML(p.platform)}</span>
          </div>
          <span class="pc-badge" style="background:${color}1f; color:${color};">${escapeHTML(cat)}</span>
        </div>
        <p class="pc-desc">${escapeHTML(p.description || p.summary || '')}</p>
        <div class="pc-footer">
          <span class="pc-dot ${fresh}"></span>
          <span>${note ? '최근 업데이트 ' + note : '업데이트 정보 없음'}</span>
        </div>
      </div>`;
  }).join('');

  grid.querySelectorAll('.product-card').forEach(card => {
    card.addEventListener('click', () => openProductSheet(allProducts[Number(card.dataset.index)]));
  });
}

// 구글 드라이브 "개별 파일" 링크(/file/d/{id}/...)일 때만 미리보기 iframe을 띄운다.
// 폴더 링크나 외부 홈페이지 링크는 그대로 새 탭으로 열도록 둔다.
function driveFileId(url) {
  const m = (url || '').match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}
// data/pdfs/... 처럼 이 저장소 안에 직접 넣은 PDF는 구글 로그인 없이 그냥 바로 열린다.
function isRepoPdf(url) {
  return !!url && !/^https?:\/\//i.test(url) && url.toLowerCase().endsWith('.pdf');
}

function openProductSheet(p) {
  document.getElementById('sheet-swatch').style.background = categoryColor(primaryCategory(p));
  document.getElementById('sheet-name').textContent = p.platform;
  document.getElementById('sheet-category').textContent = p.category || '';

  const fileId = driveFileId(p.link);
  const repoPdf = isRepoPdf(p.link);
  let previewHTML = '';
  let linkLabel = '자세히 보기';
  if (repoPdf) {
    previewHTML = `<div class="pdf-embed"><iframe src="${p.link}" loading="lazy"></iframe></div>`;
    linkLabel = 'PDF 새 탭으로 열기';
  } else if (fileId) {
    previewHTML = `<div class="pdf-embed"><iframe src="https://drive.google.com/file/d/${fileId}/preview" allow="autoplay" loading="lazy"></iframe></div>
       <p class="pdf-embed-note">미리보기가 로그인 화면만 나온다면, 드라이브에서 해당 파일을 "링크가 있는 모든 사용자"로 공유해주세요.</p>`;
    linkLabel = '드라이브에서 열기';
  }

  document.getElementById('sheet-body').innerHTML = `
    ${p.description ? `<p class="product-desc">${escapeHTML(p.description)}</p>` : ''}
    ${(p.features || []).length ? `<ul class="product-features">${p.features.map(f => `<li>${featureLineHTML(f)}</li>`).join('')}</ul>` : ''}
    ${previewHTML}
    <div class="product-footer">
      <span>${p.updated_at ? '최근 업데이트 ' + p.updated_at : ''}</span>
      ${p.link ? `<a class="product-link" href="${p.link}" target="_blank" rel="noopener">${linkLabel} ↗</a>` : ''}
    </div>`;
  document.getElementById('bottom-sheet').classList.add('open');
  document.getElementById('sheet-backdrop').classList.add('show');

  document.getElementById('sheet-body').querySelectorAll('.copy-email-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(btn.dataset.email).then(() => {
        const orig = btn.textContent;
        btn.textContent = '복사됨';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      });
    });
  });
}

// 담당자 이메일이 들어있는 특징 줄이면 바로 복사할 수 있는 작은 버튼을 붙여준다.
const EMAIL_RE = /[\w.+-]+@[\w-]+\.[\w.-]+/;
function featureLineHTML(f) {
  const m = f.match(EMAIL_RE);
  if (!m) return escapeHTML(f);
  return `${escapeHTML(f)} <button class="copy-email-btn" data-email="${escapeHTML(m[0])}" title="이메일 복사">복사</button>`;
}

function closeProductSheet() {
  document.getElementById('bottom-sheet').classList.remove('open');
  document.getElementById('sheet-backdrop').classList.remove('show');
}

document.getElementById('sheet-backdrop').addEventListener('click', closeProductSheet);
document.getElementById('sheet-close').addEventListener('click', closeProductSheet);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeProductSheet(); });

document.getElementById('tab-nav').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
  const tab = btn.dataset.tab;
  document.getElementById('panel-news').style.display = tab === 'news' ? 'block' : 'none';
  document.getElementById('panel-products').style.display = tab === 'products' ? 'block' : 'none';
});

fetch('data/products.json', { cache: 'no-store' })
  .then(res => {
    if (!res.ok) throw new Error('not found');
    return res.json();
  })
  .then(data => {
    const products = data.products || [];
    document.getElementById('products-last-updated').textContent = data.generated_at
      ? '최근 업데이트 — ' + formatKST(data.generated_at)
      : '최근 업데이트 —';
    renderProducts(products);
  })
  .catch(() => renderProducts([]));

document.getElementById('archive-toggle').addEventListener('click', () => {
  const area = document.getElementById('archive-area');
  const btn = document.getElementById('archive-toggle');
  const isHidden = area.style.display === 'none';
  area.style.display = isHidden ? 'block' : 'none';
  btn.textContent = isHidden ? '전체 보관함 접기 ▴' : '전체 보관함 펼치기 ▾';
});

document.getElementById('search-input').addEventListener('input', (e) => renderSearch(e.target.value));
document.getElementById('search-clear').addEventListener('click', () => {
  const input = document.getElementById('search-input');
  input.value = '';
  renderSearch('');
});
document.getElementById('product-search-input').addEventListener('input', (e) => {
  productSearchQuery = e.target.value;
  document.getElementById('product-search-clear').style.display = productSearchQuery.trim() ? 'block' : 'none';
  renderProductGrid();
});
document.getElementById('product-search-clear').addEventListener('click', () => {
  const input = document.getElementById('product-search-input');
  input.value = '';
  productSearchQuery = '';
  document.getElementById('product-search-clear').style.display = 'none';
  renderProductGrid();
});
document.getElementById('week-select').addEventListener('change', (e) => {
  selectedClipIndex = Number(e.target.value);
  renderBrowseArea();
});
document.getElementById('week-prev').addEventListener('click', () => {
  if (selectedClipIndex < clippings.length - 1) { selectedClipIndex++; renderBrowseArea(); }
});
document.getElementById('week-next').addEventListener('click', () => {
  if (selectedClipIndex > 0) { selectedClipIndex--; renderBrowseArea(); }
});

fetch('data/notices.json', { cache: 'no-store' })
  .then(res => {
    if (!res.ok) throw new Error('not found');
    return res.json();
  })
  .then(data => {
    allNotices = data.notices || [];
    document.getElementById('last-checked').textContent = '마지막 확인 — ' + formatKST(data.generated_at);
    const newCount = data.new_count || 0;
    document.getElementById('new-count-chip').innerHTML = newCount > 0
      ? `새 소식 <b>${newCount}</b>건`
      : '새 소식 없음';
    const platforms = [...new Set(allNotices.map(n => n.platform))];

    clippings = allNotices
      .filter(n => n.platform === CLIPPING_PLATFORM)
      .sort((a, b) => b.date.localeCompare(a.date));
    selectedClipIndex = 0;

    renderBrowseArea();
    renderFilters(platforms);
    renderFeed();

    // 화면에 "지난 방문 이후 새 글"까지 다 그린 뒤에 방문 시각을 갱신 (다음 방문 때 기준점이 됨)
    try {
      localStorage.setItem(LAST_VISIT_KEY, new Date().toISOString());
    } catch (e) {
      /* localStorage 접근 불가 - 무시하고 계속 진행 */
    }
  })
  .catch(() => {
    document.getElementById('feed').innerHTML = `
      <div class="empty-state">
        아직 수집된 데이터가 없어요. 먼저 크롤러를 실행해주세요.
        <code>python crawler.py</code>
      </div>`;
  });
</script>
