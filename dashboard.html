<!DOCTYPE html>
<!-- saved from url=(0054)file:///C:/Users/wisebirds/Downloads/dashboard_10.html -->
<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매체 공지 모니터</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link href="./dashboard_files/css2" rel="stylesheet">
<style>
  :root {
    --bg: #10141b;
    --panel: #171d27;
    --panel-hover: #1d2430;
    --page: #1a212c;
    --line: #232b38;
    --line-soft: #1c2330;
    --text: #e7ebf1;
    --muted: #7c8494;
    --faint: #565f70;
    --accent: #f2a93b;
    --accent-dim: rgba(242,169,59,0.12);
    --gfa: #5b8def;
    --nosp: #7fd1a8;
    --common: #b48ee8;
    --kakao: #f4d35e;
    --meta: #6ea8fe;
    --nasmedia: #ff9f8c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 20px 80px; }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--line);
  }
  .title-block h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 25px;
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  .title-block .sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .status-block { text-align: right; }
  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--accent);
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(242,169,59,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(242,169,59,0); }
    100% { box-shadow: 0 0 0 0 rgba(242,169,59,0); }
  }
  .new-count {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    color: var(--muted);
  }
  .new-count b { color: var(--accent); font-size: 15px; }

  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .filter-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .filter-btn:hover { border-color: #3a4457; color: var(--text); }
  .filter-btn.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  .pinned-section {
    margin-bottom: 28px;
    padding-bottom: 24px;
    border-bottom: 1px dashed var(--line);
  }
  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--accent);
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }

  .day-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin: 22px 0 10px;
  }
  .day-group:first-child .day-label { margin-top: 0; }

  .notice-card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 8px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .notice-card:hover { background: var(--panel-hover); border-color: #333f52; }
  .notice-card.pinned { border-left: 3px solid var(--accent); }

  .card-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
  }
  .platform-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 5px;
    letter-spacing: 0.02em;
    flex-shrink: 0;
  }
  .platform-tag.gfa { background: #5b8def1f; color: var(--gfa); }
  .platform-tag.nosp { background: #7fd1a81f; color: var(--nosp); }
  .platform-tag.common { background: #b48ee81f; color: var(--common); }
  .platform-tag.kakao { background: #f4d35e1f; color: var(--kakao); }
  .platform-tag.meta { background: #6ea8fe1f; color: var(--meta); }
  .platform-tag.nasmedia { background: #ff9f8c1f; color: var(--nasmedia); }

  .cat-label {
    font-size: 11px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .new-flag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.04em;
    margin-left: auto;
    flex-shrink: 0;
    background: var(--accent-dim);
    padding: 2px 7px;
    border-radius: 4px;
  }
  .notice-title {
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--text);
  }

  .page-card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--page);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 10px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .page-card:hover { border-color: #3a4457; box-shadow: 0 2px 14px rgba(0,0,0,0.25); }

  .page-eyebrow {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--nasmedia);
    letter-spacing: 0.03em;
    margin-bottom: 10px;
  }
  .page-eyebrow .divider { color: var(--faint); }
  .page-eyebrow .cat { color: var(--muted); }
  .page-eyebrow .new-flag { margin-left: auto; }

  .page-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16.5px;
    font-weight: 700;
    line-height: 1.4;
    color: var(--text);
    margin-bottom: 10px;
  }

  .page-platforms {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  .platform-chip {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    background: #ff9f8c17;
    color: var(--nasmedia);
    border: 1px solid #ff9f8c30;
  }

  .page-excerpt {
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--muted);
    margin: 0 0 12px;
  }

  .page-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--faint);
    padding-top: 10px;
    border-top: 1px solid var(--line-soft);
  }
  .page-footer .open-link { color: var(--muted); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    line-height: 1.8;
  }
  .empty-state code {
    display: block;
    margin-top: 12px;
    background: var(--panel);
    padding: 10px 14px;
    border-radius: 6px;
    color: var(--accent);
  }

  /* ---- hero: this week's nasmedia news clipping, always on top ---- */
  .hero-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }
  .hero-label .line { flex: 1; height: 1px; background: var(--line); }

  .hero-card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: linear-gradient(160deg, #1f2a3a 0%, var(--page) 55%);
    border: 1px solid #3a4457;
    border-radius: 16px;
    padding: 26px 26px 22px;
    margin-bottom: 32px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .hero-card:hover { border-color: var(--accent); transform: translateY(-1px); }

  .hero-eyebrow {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--nasmedia);
    letter-spacing: 0.04em;
    margin-bottom: 12px;
  }
  .hero-eyebrow .week-badge {
    background: var(--accent-dim);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 500;
    margin-left: auto;
  }

  .hero-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 12px;
  }

  .hero-platforms { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }

  .hero-excerpt {
    font-size: 14px;
    line-height: 1.75;
    color: #b9c0cd;
    margin: 0 0 16px;
  }

  .hero-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--muted);
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .hero-footer .open-link { color: var(--accent); font-weight: 500; }

  /* ---- weekly quick-scan list (other platforms' new items this week) ---- */
  .weekly-section { margin-bottom: 28px; }
  .weekly-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }
  .weekly-list { display: flex; flex-direction: column; gap: 6px; }
  .weekly-item {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
    transition: background 0.15s ease;
  }
  .weekly-item:hover { background: var(--panel-hover); }
  .weekly-item .wi-title { font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .weekly-empty {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--faint);
    padding: 10px 2px;
  }

  /* ---- archive toggle ---- */
  .archive-toggle-wrap { text-align: center; margin: 8px 0 24px; }
  .archive-toggle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 8px 18px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .archive-toggle:hover { color: var(--text); border-color: #3a4457; }

  @media (max-width: 480px) {
    header { flex-direction: column; gap: 14px; }
    .status-block { text-align: left; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <h1>매체 공지 모니터</h1>
      <div class="sub" id="last-checked">마지막 확인 —</div>
    </div>
    <div class="status-block">
      <div class="live-badge"><span class="live-dot"></span>LIVE</div>
      <div class="new-count" id="new-count"></div>
    </div>
  </header>

  <div id="hero-area"></div>
  <div id="weekly-area"></div>

  <div class="archive-toggle-wrap">
    <button class="archive-toggle" id="archive-toggle">전체 보관함 펼치기 ▾</button>
  </div>
  <div id="archive-area" style="display:none;">
    <div class="filters" id="filters"></div>
    <div id="pinned-area"></div>
    <div id="feed">
      <div class="empty-state">
        아직 수집된 데이터가 없어요. 먼저 크롤러를 실행해주세요.
        <code>python crawler.py</code>
      </div></div>
  </div>
</div>

<script>
const PLATFORM_CLASS = {
  '네이버 GFA': 'gfa',
  'NOSP': 'nosp',
  '카카오모먼트': 'kakao',
  '메타 for Business': 'meta',
  '나스미디어 뉴스클리핑': 'nasmedia',
  '나스미디어 광고상품업데이트': 'nasmedia',
};

let allNotices = [];
let activeFilter = '전체';

function formatKST(isoString) {
  const d = new Date(isoString);
  const opts = { month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Seoul' };
  return new Intl.DateTimeFormat('ko-KR', opts).format(d) + ' (KST)';
}

function escapeHTML(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function cardHTML(n) {
  if (n.excerpt) {
    const platformsHTML = (n.platforms || []).map(p => `<span class="platform-chip">${escapeHTML(p)}</span>`).join('');
    return `
      <a class="page-card" href="${n.url}" target="_blank" rel="noopener">
        <div class="page-eyebrow">
          <span>🗒️ 나스미디어</span>
          <span class="divider">·</span>
          <span class="cat">${escapeHTML(n.category)}</span>
          ${n.is_new ? '<span class="new-flag">NEW</span>' : ''}
        </div>
        <div class="page-title">${escapeHTML(n.title)}</div>
        ${platformsHTML ? `<div class="page-platforms">${platformsHTML}</div>` : ''}
        <p class="page-excerpt">${escapeHTML(n.excerpt)}</p>
        <div class="page-footer">
          <span>${n.date}</span>
          <span class="open-link">원문 보기 ↗</span>
        </div>
      </a>`;
  }

  return `
    <a class="notice-card ${n.is_pinned ? 'pinned' : ''}" href="${n.url}" target="_blank" rel="noopener">
      <div class="card-top">
        <span class="platform-tag ${PLATFORM_CLASS[n.platform] || 'common'}">${escapeHTML(n.platform)}</span>
        <span class="cat-label">${escapeHTML(n.category)}</span>
        ${n.is_new ? '<span class="new-flag">NEW</span>' : ''}
      </div>
      <div class="notice-title">${escapeHTML(n.title)}</div>
    </a>`;
}

function renderFilters(platforms) {
  const el = document.getElementById('filters');
  const list = ['전체', ...platforms];
  el.innerHTML = list.map(p =>
    `<button class="filter-btn ${p === activeFilter ? 'active' : ''}" data-platform="${escapeHTML(p)}">${escapeHTML(p)}</button>`
  ).join('');
  el.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.platform;
      renderFilters(platforms);
      renderFeed();
    });
  });
}

function renderFeed() {
  const feed = document.getElementById('feed');
  const pinnedArea = document.getElementById('pinned-area');

  const filtered = activeFilter === '전체'
    ? allNotices
    : allNotices.filter(n => n.platform === activeFilter);

  if (filtered.length === 0) {
    pinnedArea.innerHTML = '';
    feed.innerHTML = '<div class="empty-state">해당 매체의 공지가 없어요.</div>';
    return;
  }

  const pinned = filtered.filter(n => n.is_pinned);
  const rest = filtered.filter(n => !n.is_pinned);

  pinnedArea.innerHTML = pinned.length ? `
    <div class="pinned-section">
      <div class="section-label">📌 고정 공지</div>
      ${pinned.map(cardHTML).join('')}
    </div>` : '';

  const groups = {};
  rest.forEach(n => { (groups[n.date] = groups[n.date] || []).push(n); });
  const dates = Object.keys(groups).sort().reverse();

  feed.innerHTML = dates.map(date => `
    <div class="day-group">
      <div class="day-label">${date}</div>
      ${groups[date].map(cardHTML).join('')}
    </div>
  `).join('');
}

function renderHero() {
  const heroArea = document.getElementById('hero-area');
  const clippings = allNotices
    .filter(n => n.platform === '나스미디어 뉴스클리핑')
    .sort((a, b) => b.date.localeCompare(a.date));

  if (!clippings.length) { heroArea.innerHTML = ''; return; }

  const hero = clippings[0];
  const platformsHTML = (hero.platforms || []).map(p => `<span class="platform-chip">${escapeHTML(p)}</span>`).join('');

  heroArea.innerHTML = `
    <div class="hero-label"><span>📌 이번 주 브리핑</span><span class="line"></span></div>
    <a class="hero-card" href="${hero.url}" target="_blank" rel="noopener">
      <div class="hero-eyebrow">
        <span>🗒️ 나스미디어 뉴스클리핑</span>
        ${hero.is_new ? '<span class="week-badge">이번 주 발행</span>' : ''}
      </div>
      <div class="hero-title">${escapeHTML(hero.title)}</div>
      ${platformsHTML ? `<div class="hero-platforms">${platformsHTML}</div>` : ''}
      <p class="hero-excerpt">${escapeHTML(hero.excerpt || '')}</p>
      <div class="hero-footer">
        <span>${hero.date} 발행</span>
        <span class="open-link">전체 클리핑 읽기 ↗</span>
      </div>
    </a>`;
}

function renderWeekly() {
  const weeklyArea = document.getElementById('weekly-area');
  const items = allNotices
    .filter(n => n.is_new && n.platform !== '나스미디어 뉴스클리핑')
    .sort((a, b) => b.date.localeCompare(a.date));

  const listHTML = items.length
    ? items.map(n => `
        <a class="weekly-item" href="${n.url}" target="_blank" rel="noopener">
          <span class="platform-tag ${PLATFORM_CLASS[n.platform] || 'common'}">${escapeHTML(n.platform)}</span>
          <span class="wi-title">${escapeHTML(n.title)}</span>
          <span class="new-flag">NEW</span>
        </a>`).join('')
    : '<div class="weekly-empty">이번 주 다른 매체 새 소식은 없어요.</div>';

  weeklyArea.innerHTML = `
    <div class="weekly-section">
      <div class="weekly-title">그 외 이번 주 새 소식 (${items.length}건)</div>
      <div class="weekly-list">${listHTML}</div>
    </div>`;
}

document.getElementById('archive-toggle').addEventListener('click', () => {
  const area = document.getElementById('archive-area');
  const btn = document.getElementById('archive-toggle');
  const isHidden = area.style.display === 'none';
  area.style.display = isHidden ? 'block' : 'none';
  btn.textContent = isHidden ? '전체 보관함 접기 ▴' : '전체 보관함 펼치기 ▾';
});

fetch('data/notices.json')
  .then(res => {
    if (!res.ok) throw new Error('not found');
    return res.json();
  })
  .then(data => {
    allNotices = data.notices || [];
    document.getElementById('last-checked').textContent = '마지막 확인 — ' + formatKST(data.generated_at);
    const newCount = data.new_count || 0;
    document.getElementById('new-count').innerHTML = newCount > 0
      ? `새 소식 <b>${newCount}</b>건`
      : '새 소식 없음';
    const platforms = [...new Set(allNotices.map(n => n.platform))];
    renderHero();
    renderWeekly();
    renderFilters(platforms);
    renderFeed();
  })
  .catch(() => {
    document.getElementById('feed').innerHTML = `
      <div class="empty-state">
        아직 수집된 데이터가 없어요. 먼저 크롤러를 실행해주세요.
        <code>python crawler.py</code>
      </div>`;
  });
</script>


</body></html>
